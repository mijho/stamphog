name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run check-types
      - name: Lint
        run: bun run check
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
